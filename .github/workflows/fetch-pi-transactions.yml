name: Fetch Pi Tracker Transactions
on:
  schedule:
    # 매시 23분에 실행 (마켓 시세 스크립트와 시간 겹치지 않게 분산)
    - cron: '23 * * * *'
  workflow_dispatch: {}  # Actions 탭에서 수동 실행 가능
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
      - name: Node.js 설치
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Pi 입금 데이터 갱신 스크립트 실행
        run: node scripts/fetch-pi-transactions.mjs
      - name: 변경사항 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/pi-tracker.json
          git diff --staged --quiet || git commit -m "chore: update pi tracker data $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
